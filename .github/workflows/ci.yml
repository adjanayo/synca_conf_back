name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: syncaconf
          MYSQL_USER: syncaconf
          MYSQL_PASSWORD: syncaconf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      MYSQL_USER: syncaconf
      MYSQL_PASSWORD: syncaconf
      MYSQL_DATABASE: syncaconf
      # CI-only value -- never the production secret, which has no default
      # (see app/core/config.py) and must be set for real in the deploy env.
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production-use-only-32b
      # CI-only Fernet key (7.8) -- generated once for this test key, never
      # the production key, which also has no default.
      FERNET_KEY: DCvwpRDZK1RJuv1KF0UDar2qdP6QBzXmS_QQbkqTgCQ=

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  image-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image (linux/amd64)
        run: docker build --target runtime -t synca-app:ci .

      - name: Check image size (< 200 Mo)
        run: |
          size_bytes=$(docker image inspect synca-app:ci --format='{{.Size}}')
          size_mb=$((size_bytes / 1000 / 1000))
          echo "Image size: ${size_mb} Mo"
          if [ "$size_mb" -gt 200 ]; then
            echo "::error::Image trop lourde (${size_mb} Mo > 200 Mo)"
            exit 1
          fi

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: synca-app:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
