x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
    restart: unless-stopped
    mem_limit: 600m
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4.11
    env_file:
      - .env
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    restart: unless-stopped
    mem_limit: 800m
    logging: *default-logging
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.11.4-alpine
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 100m
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
