name: synca-conf-back

services:
  app:
    build:
      context: .
      target: dev
    image: dev-app
    container_name: dev-app
    env_file:
      - .env
    environment:
      ENVIRONMENT: local
    ports:
      - "8010:8000"
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dev-minio
    env_file:
      - .env
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: mysql:8.4.11
    container_name: dev-db
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    name: dev-mysql-data
  minio_data:
    name: dev-minio-data
