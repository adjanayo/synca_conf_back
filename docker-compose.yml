name: synca-dev

services:
  app:
    build:
      context: .
      target: dev
    image: synca-dev-app
    container_name: synca-dev-app
    env_file:
      - .env
    environment:
      ENVIRONMENT: local
    ports:
      - "8010:8000"
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4.11
    container_name: synca-dev-db
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    name: synca-dev-mysql-data
